# Pre-commit hooks: lint + type + dead-code + safety
# Setup (requer ambiente com pip/venv):
#   pip install pre-commit ruff pyright vulture safety
#   pre-commit install
# Depois todo commit roda os checks abaixo.
#
# NOTA: o container atual nao tem pip/venv instalado, entao estes hooks
# ficam configurados mas nao executam ate o ambiente ser provisionado.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright (type check)
        # runs the locally-installed pyright (mirrors-pyright upstream is dead)
        entry: pyright
        language: system
        types: [python]
        pass_filenames: false

  - repo: local
    hooks:
      - id: vulture
        name: vulture (dead code, min-confidence 65)
        entry: vulture --min-confidence 65 core tests cli.py run_api.py
        language: system
        types: [python]
        pass_filenames: false

      - id: safety
        name: safety (dependency vulnerabilities)
        entry: safety check --full-report
        language: system
        files: requirements.txt
        pass_filenames: false
