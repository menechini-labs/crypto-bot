<script>
window.onerror = function(msg, url, line, col, err) {
  var root = document.getElementById('root');
  if (root) {
    root.innerHTML = '<div style="color:#f87171;padding:2rem;font-family:monospace">' +
      '<h2>⚠ Runtime Error</h2>' +
      '<p><strong>' + (err ? err.message : msg) + '</strong></p>' +
      '<p style="color:#8b97a8;font-size:13px">' + url + ':' + line + ':' + col + '</p>' +
      '</div>';
  }
  console.error('FATAL:', msg, url, line);
  return false;
};
window.addEventListener('unhandledrejection', function(e) {
  var root = document.getElementById('root');
  if (root) {
    root.innerHTML = '<div style="color:#f87171;padding:2rem;font-family:monospace">' +
      '<h2>⚠ Unhandled Promise Rejection</h2>' +
      '<p><strong>' + (e.reason ? e.reason.message || e.reason : 'unknown') + '</strong></p>' +
      '</div>';
  }
});
</script>
