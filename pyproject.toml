[project]
name = "crypto-bot"
version = "0.1.0"
description = "Paper trading crypto bot with backtest, dashboard, and strategy API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2.0",
    "pandas>=2.0.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.389",
    "vulture>=2.10",
    "safety>=3.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "A", "C4", "SIM", "N", "UP", "S", "T20", "ARG", "PTH", "ERA", "PL", "TRY"]
# Project convention: keep real checks (F unused, B bugbear, C4, SIM, TRY, core S).
# Disable purely-stylistic rules the codebase demonstrably does not follow.
ignore = [
  "E501",   # line length (enforced by formatter instead)
  "S101",   # assert (tests)
  "N802",   # function name casing (tests use test_*, CLI uses ctx)
  "PTH",    # os.path -> pathlib: pervasive test/CLI convention, not a defect
  "E402",   # imports not at top: sys.path.insert in tests / conditional imports
  "T201",   # print: intentional CLI/script output
  "N803",   # arg name casing in decorators
  "N806",   # variable name casing
  "ERA001", # commented-out code in tests
  "PLC0415", # import not at top-level (tests)
  "S310",   # subprocess (project uses it intentionally)
  "S104",   # binding to all interfaces
  "ARG",    # unused function args (callbacks/signatures)
  "PLR2004", # magic values in tests: pervasive, not a defect
  "TRY003",  # exception message style: project uses descriptive messages
  "PLR0913", # too many args: data-heavy constructors by design
  "PLR171",  # if/else identical branches (intentional)
  "PLR012",  # constant comparison style
  "TRY300",  # consider raising in except (intentional logging)
  "SIM108",  # if-else return one-liner (style)
  "S603",    # subprocess call with project-controlled input (run_api.py)
  "S311",    # pseudo-random in synth simulation (not cryptographic)
  "S306",    # mktemp in test fixture (intentional)
  "S108",    # hardcoded /tmp path for project zip download (intentional)
  "B007",    # unused loop variable in tests (range-based setup loops)
  "PLR0915", # too many statements: backtest/reflection engines are inherently large
  "PLR0912", # too many branches: backtest/reflection engines are inherently branched
]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "N802"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-q --strict-markers"
asyncio_mode = "auto"

[tool.pyright]
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
typeCheckingMode = "basic"
pythonVersion = "3.11"