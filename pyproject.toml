[project]
name = "crypto-bot"
version = "0.1.0"
description = "Paper trading crypto bot with backtest, dashboard, and strategy API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ccxt>=4.2.0",
    "pandas>=2.0.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
    "pyright>=1.1.389",
    "vulture>=2.10",
    "safety>=3.2.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "B", "A", "C4", "SIM", "N", "UP", "S", "T20", "ARG", "PTH", "ERA", "PL", "TRY"]
ignore = ["E501", "S101"]
fixable = ["ALL"]
unfixable = ["T20"]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
python_classes = ["Test*"]
addopts = "-q --strict-markers"

[tool.pyright]
reportMissingImports = "warning"
reportMissingTypeStubs = "warning"
typeCheckingMode = "basic"
pythonVersion = "3.11"